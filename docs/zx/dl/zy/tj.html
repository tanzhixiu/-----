<h3>团结友善</h3>
<p>“团结友善”是公民与公民之间应当如何相处的基本规范。每一个公民，不论民族、年龄、职业，都是中华人民共和国这个大家庭中的一员。公民之间应该彼此团结，相互友爱，建立起一种和睦亲爱的关系。</p >
<p>历史和现实一再证明，团结就是力量。在一个社会里，如果人与人之间四分五裂、互相争斗，社会就不可能稳定发展。友善，是待人的基本道德要求，待人友好、与人为善，能够减少矛盾、化解冲突，营造和谐的人际氛围。</p >
