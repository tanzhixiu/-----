<h3>敬业奉献</h3>
<p>“敬业奉献”是公民对待职业活动的道德规范。每一个公民都要从事一定的职业，职业是公民与社会联系的重要方式和途径。对待职业或事业，要兢兢业业、忠于职守、精益求精，这就是敬业。</p >
<p>奉献，就是从业人员要把自己的劳动成果奉献给社会，在岗位上服务他人、服务社会，不计较个人得失。敬业和奉献是紧密联系在一起的，敬业是奉献的基础，奉献是敬业的升华。各行各业的劳动者，只有做到敬业奉献，才能推动社会不断向前发展。</p >
