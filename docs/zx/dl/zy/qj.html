<h3>勤俭自强</h3>
<p>“勤俭自强”是公民对待生活、对待自身的道德规范。作为一个公民，有劳动的权利，同时也有劳动的义务。公民在自己的生活中，既要勤劳工作、努力创造物质财富，也要勤俭节约，珍惜劳动成果，反对铺张浪费。</p >
<p>自强，要求公民要努力提高自己的思想道德素质和科学文化素质，不断进步，奋发有为，不自卑、不气馁，面对困难能够依靠自身努力去克服，树立独立自强的人生态度。勤俭是中华民族传统美德，自强是个人进步和发展的内在动力。</p >
