<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图书馆读者调查问卷</title>
<style>
body { font-family: "微软雅黑", sans-serif; font-size: 14px; margin: 20px; background: #e8e8e8; }
.box { width: 650px; margin: 0 auto; background: #f0f0f0; padding: 20px; }
h2 { text-align: center; color: #333; }
.intro { text-indent: 2em; line-height: 1.8; margin: 15px 0; }
.q { margin: 12px 0; line-height: 1.8; }
</style>
</head>
<body>
<div class="box">
  <h2>图书馆读者调查问卷</h2>
  <p class="intro">为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！</p>
  <form method="post" action="">
    <div class="q">1. 您的年级<br>
      <input type="text" name="grade">
    </div>
    <div class="q">2. 您的专业<br>
      <input type="text" name="major">
    </div>
    <div class="q">3. 对于图书馆的阅览环境<br>
      <input type="radio" name="env" value="满意">满意<br>
      <input type="radio" name="env" value="基本满意">基本满意<br>
      <input type="radio" name="env" value="不满意">不满意　您的建议：<input type="text" name="env_suggest">
    </div>
    <div class="q">4. 您到图书馆的原因是（可多选）：<br>
      <input type="checkbox" name="reason" value="借阅专业图书">借阅专业图书<br>
      <input type="checkbox" name="reason" value="随便坐坐，翻翻书刊">随便坐坐，翻翻书刊<br>
      <input type="checkbox" name="reason" value="借阅光盘">借阅光盘<br>
      <input type="checkbox" name="reason" value="参加图书馆组织的活动">参加图书馆组织的活动<br>
      <input type="checkbox" name="reason" value="自习，复习功课">自习，复习功课<br>
      <input type="checkbox" name="reason" value="上网">上网<br>
      <input type="checkbox" name="reason" value="检索电子文献">检索电子文献
    </div>
    <div class="q">5. 您到图书馆的频率<br>
      <input type="radio" name="freq" value="几乎每天">几乎每天<br>
      <input type="radio" name="freq" value="每周1-2次">每周1-2次<br>
      <input type="radio" name="freq" value="每月1-2次">每月1-2次<br>
      <input type="radio" name="freq" value="几乎不去">几乎不去
    </div>
    <div class="q">6. 您对学校的建议<br>
      请您提出宝贵建议：<br>
      <textarea name="suggest" rows="4" cols="50"></textarea>
    </div>
  </form>
</div>
</body>
</html>
